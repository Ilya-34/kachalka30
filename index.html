<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тоннаж">
<meta name="application-name" content="Тоннаж">
<meta name="description" content="Тоннаж: записывай подходы, смотри прогресс.">
<meta name="theme-color" content="#1b1a24">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:dark;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Тоннаж</title>
<link rel="preload" href="fonts/ps2p-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/tiny5-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ТОННАЖ · пиксельный стиль. Герой: Бро Борис (розовая майка, чёрные усы). Контуры и тени без размытия, углы «со ступенькой». */
@font-face{font-family:"Tiny5";font-weight:400;font-display:swap;src:url(fonts/tiny5-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Tiny5";font-weight:400;font-display:swap;src:url(fonts/tiny5-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Press Start 2P";font-weight:400;font-display:swap;src:url(fonts/ps2p-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Press Start 2P";font-weight:400;font-display:swap;src:url(fonts/ps2p-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#1b1a24; --bg2:#201f2b; --surface:#272535; --surface2:#34304a; --ink:#f6f1e7; --ink2:#c9c4dc; --mute:#948eae;
  --o:#0b0a10; --line:#0b0a10; --accent:#ff3db8; --accent2:#c42a8f; --on-accent:#14101c; --bub:#f6f1e7;
  --ok:#45e09b; --danger:#ff6a62; --pr:#ffd23f; --pr-bg:#4a3b0a;
  --m1:#4aa8ff; --m2:#ff7a3d; --m3:#3ddc97; --m4:#ffd23f; --m5:#c77dff; --m6:#8fe04a; --m7:#7f86ff; --m8:#ff5a52;
  --f-head:"Press Start 2P","Courier New",monospace; --f-body:"Tiny5",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ob:0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o);
  --bev:inset 0 -4px 0 0 rgba(0,0,0,.30),inset 0 4px 0 0 rgba(255,255,255,.07);
  --tabh:66px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{background-color:var(--bg);
  background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%),linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;
  color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.35;-webkit-font-smoothing:none;font-synthesis:none;
  padding-inline:18px;padding-block:20px calc(var(--tabh) + 120px);-webkit-text-size-adjust:100%}
#app{max-width:640px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
img{image-rendering:pixelated}
.pxi{display:block;fill:currentColor;width:1em;height:auto}
.num{font-family:var(--f-head);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .ink2{color:var(--ink2)}
.label{font-family:var(--f-head);font-size:8px;line-height:1.5;letter-spacing:0;text-transform:uppercase;color:var(--mute)}

/* шапки */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-family:var(--f-head);font-size:16px;line-height:1.5;text-transform:uppercase;color:var(--accent);text-shadow:3px 3px 0 var(--o)}
.top .nav{display:flex;gap:8px;align-items:center}
.ib{width:42px;height:42px;background:var(--surface2);box-shadow:var(--ob),var(--bev);display:grid;place-items:center;font-size:26px;line-height:1}
.ib .pxi{width:16px}
.ib:active{transform:translateY(3px)}
.pill{height:42px;padding-inline:14px;background:var(--surface2);box-shadow:var(--ob),var(--bev);font-weight:600;font-size:18px}
.pill:active{transform:translateY(3px)}
.sync{font-size:16px;color:var(--mute);margin:-6px 0 14px;min-height:1px}
.banner{background:var(--surface);box-shadow:var(--ob),var(--bev);padding:12px 14px;margin-bottom:18px;font-size:18px;color:var(--ink2);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{min-height:46px;padding:10px 18px;background:var(--surface2);color:var(--ink);font-weight:600;font-size:20px;line-height:1.15;
  box-shadow:var(--ob),0 6px 0 0 var(--o),inset 0 -4px 0 0 rgba(0,0,0,.30),inset 0 4px 0 0 rgba(255,255,255,.12);margin-bottom:6px}
.btn:active{transform:translateY(4px);box-shadow:var(--ob),0 2px 0 0 var(--o),inset 0 4px 0 0 rgba(0,0,0,.30)}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:var(--ob),0 6px 0 0 var(--o),inset 0 -4px 0 0 rgba(120,10,80,.45),inset 0 4px 0 0 rgba(255,255,255,.28)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:18px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}

/* плашка статистики */
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);box-shadow:var(--ob),var(--bev);margin-bottom:18px}
.strip>div{padding:10px 12px;min-width:0}
.strip>div+div{border-left:3px solid var(--o)}
.strip .v{font-family:var(--f-head);font-size:16px;line-height:1.5;margin-top:4px;color:var(--ink);white-space:nowrap}
.strip .v small{font-size:16px;color:var(--mute);font-family:var(--f-body)}

/* календарь */
.cal{background:var(--surface);box-shadow:var(--ob),var(--bev);padding:10px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{font-family:var(--f-head);font-size:8px;text-align:center;color:var(--mute);text-transform:uppercase;padding-bottom:8px}
.day{min-height:54px;background:var(--surface2);border:2px solid var(--o);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding-top:6px}
.day.blank{pointer-events:none;background:none;border-color:transparent}
.day .dn{font-family:var(--f-head);font-size:8px;line-height:16px;height:16px;min-width:16px;text-align:center}
.day.has{background:#3d3858}
.day.today .dn{background:var(--accent);color:var(--on-accent);padding-inline:2px}
.day.sel{outline:3px solid var(--ink);outline-offset:-1px}
.dots{display:flex;gap:3px;height:7px;align-items:center}
.dots i{width:7px;height:7px;background:var(--mc)}
.dots b{font-size:12px;line-height:1;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:16px 2px 0;font-size:17px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;background:var(--mc);display:inline-block;box-shadow:0 0 0 2px var(--o)}
.daypanel{margin-top:24px}
.daypanel .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.daypanel h2{font-family:var(--f-head);font-size:12px;line-height:1.5;text-transform:uppercase;color:var(--ink)}
.wcard{display:block;width:100%;text-align:left;background:var(--surface);box-shadow:var(--ob),var(--bev);padding:12px 14px;margin-bottom:14px}
.wcard .t{font-weight:700;font-size:22px}
.wcard .m{font-size:17px;color:var(--ink2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:17px;background:var(--surface2);box-shadow:0 0 0 2px var(--o);padding:2px 9px 2px 8px;height:28px;color:var(--ink2)}
.chip i{width:8px;height:8px;background:var(--mc)}
button.chip{cursor:pointer;height:34px;padding-inline:12px;font-size:18px}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 2px var(--o)}
button.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--o)}
.empty{background:var(--surface);border:3px dashed var(--mute);padding:18px;text-align:center;color:var(--ink2);font-size:19px}
.empty .btn{margin-top:14px}
.empty img.sc{display:block;margin:0 auto 12px;border:3px solid var(--o)}

/* тренировка */
.back{display:inline-flex;align-items:center;gap:8px;color:var(--ink2);font-weight:600;font-size:19px;height:34px}
.back .pxi{width:10px}
.wtitle{width:100%;border:0;border-bottom:4px solid var(--o);background:transparent;font-family:var(--f-head);font-size:16px;line-height:1.5;text-transform:uppercase;padding:6px 0 10px;border-radius:0;color:var(--accent)}
.wtitle::placeholder{color:var(--mute)}
.wmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.wdate{background:var(--surface2);box-shadow:var(--ob);border:0;height:38px;padding-inline:10px;font-size:18px;color-scheme:dark}
.rest-pick{display:flex;align-items:center;gap:8px;margin:6px 0 20px;flex-wrap:wrap}
.rest-pick .label{margin-right:4px}
.ex{background:var(--surface);box-shadow:var(--ob),var(--bev);padding:14px;margin-bottom:18px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex h3{font-size:23px;line-height:1.2}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:17px;color:var(--ink2);margin-top:4px}
.tag i{width:9px;height:9px;background:var(--mc)}
.prchip{font-family:var(--f-head);font-size:8px;line-height:1.5;background:var(--pr);color:#2a1f00;padding:5px 7px;white-space:nowrap;box-shadow:0 0 0 2px var(--o)}
.prev{font-size:17px;color:var(--mute);margin:10px 0 12px}
.set,.sets-h{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:8px;align-items:center}
.sets-h{margin-bottom:6px}
.sets-h span{font-family:var(--f-head);font-size:8px;text-transform:uppercase;color:var(--mute);text-align:center}
.set{margin-bottom:8px}
.set .n{font-family:var(--f-head);color:var(--mute);text-align:center;font-size:8px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center;background:var(--bg);box-shadow:0 0 0 3px var(--o);height:44px}
.step button{height:44px;font-size:26px;font-weight:700;color:var(--ink2);line-height:1}
.step button:active{background:var(--surface2)}
.step input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--f-head);font-size:16px;padding:0;height:44px;border-radius:0}
.step input:focus-visible{outline:0}
.step:focus-within{box-shadow:0 0 0 3px var(--accent)}
.chk{height:44px;width:44px;background:var(--surface2);box-shadow:var(--ob),var(--bev);display:grid;place-items:center;color:var(--on-accent)}
.chk .pxi{width:22px;opacity:0}
.set.done .chk{background:var(--accent);box-shadow:var(--ob),inset 0 -4px 0 0 rgba(120,10,80,.45),inset 0 4px 0 0 rgba(255,255,255,.28)}
.set.done .chk .pxi{opacity:1}
.set.done .step{box-shadow:0 0 0 3px var(--ok)}
.ex-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.addex{width:100%;min-height:52px;border:3px dashed var(--mute);font-weight:700;font-size:22px;color:var(--ink2);background:transparent}
.addex:active{background:var(--surface)}

/* таймер отдыха */
#rest{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:30;padding-inline:18px;pointer-events:none}
.restbar{max-width:640px;margin-inline:auto;background:var(--ink);color:#14101c;padding:10px 12px 12px;pointer-events:auto;box-shadow:var(--ob),0 6px 0 0 var(--o)}
.restbar .row{display:flex;align-items:center;gap:8px}
.restbar .t{font-family:var(--f-head);font-size:24px;line-height:1;min-width:92px}
.restbar .cap{font-size:17px;flex:1;line-height:1.15}
.restbar button{height:36px;padding-inline:10px;background:#14101c;color:var(--ink);font-weight:600;font-size:18px;box-shadow:0 0 0 2px var(--o)}
.restbar .bar{height:10px;background:#cfc8e0;margin-top:10px;box-shadow:0 0 0 2px var(--o);overflow:hidden}
.restbar .bar i{display:block;height:100%;background:var(--accent);width:100%}
.restbar.over .t{animation:blink .8s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}

/* нижнее меню */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:4px solid var(--o);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs div{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:16px;font-weight:600;color:var(--mute)}
#tabs button .pxi{width:24px}
#tabs button[aria-current="page"]{color:var(--accent);background:var(--bg)}
#tabs button[aria-current="page"]::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--accent)}

/* переключатели, карточки */
.seg{display:inline-flex;box-shadow:var(--ob);background:var(--surface);flex:none}
.seg button{height:36px;padding-inline:10px;white-space:nowrap;font-size:18px;font-weight:600;color:var(--ink2)}
.seg button+button{border-left:3px solid var(--o)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);box-shadow:var(--ob),var(--bev);padding:14px;margin-bottom:20px}
.card h2{font-family:var(--f-head);font-size:12px;line-height:1.5;text-transform:uppercase;margin-bottom:14px;color:var(--ink)}
.dd{height:44px;width:100%;border:0;box-shadow:0 0 0 3px var(--o);background:var(--bg);padding-inline:10px;font-weight:600;min-width:0;border-radius:0;color-scheme:dark}
.ctl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.delta{font-size:19px;color:var(--ink2);margin:2px 0 10px}
.delta b{font-family:var(--f-head);font-size:16px;color:var(--ok);font-weight:400;line-height:1.6}
.chart{position:relative;width:100%;min-height:60px}
.chart svg{display:block;max-width:100%;touch-action:pan-y;overflow:visible;shape-rendering:crispEdges}
.chart text{font-family:var(--f-body);font-size:14px;fill:var(--mute)}
.chart .grid{stroke:#3a3652;stroke-width:2}
.chart .axis{stroke:var(--mute);stroke-width:2}
.chart .ln{fill:none;stroke:var(--sc);stroke-width:4;stroke-linejoin:miter;stroke-linecap:butt}
.chart .ar{fill:var(--sc);fill-opacity:.16;stroke:none}
.chart .pt{fill:var(--sc);stroke:var(--o);stroke-width:2}
.chart .cross{stroke:var(--mute);stroke-width:2;stroke-dasharray:4 4}
.chart .vl{fill:var(--ink);font-family:var(--f-head);font-size:8px}
.chart .seg-r{stroke:var(--o);stroke-width:2}
.chart .hl{fill:#fff;fill-opacity:.07}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#14101c;padding:6px 9px;font-size:16px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);z-index:3;box-shadow:0 0 0 2px var(--o)}
.tip b{font-family:var(--f-head);font-size:8px;font-weight:400}
.tip i{display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--mc)}
.note{font-size:17px;color:var(--mute);margin-top:10px}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:3px solid var(--o)}
.rec:first-of-type{border-top:0}
.rec .nm{font-weight:600;overflow-wrap:anywhere}
.rec .v{font-family:var(--f-head);font-size:12px;text-align:right;color:var(--pr);line-height:1.6}
.rec .s{font-size:16px;color:var(--mute)}
.rec .s:last-child{text-align:right}

/* листы */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet .bd{position:absolute;inset:0;background:rgba(5,4,10,.72)}
#sheet .pn{position:relative;width:100%;max-width:640px;max-height:88%;overflow:auto;background:var(--surface);border-top:4px solid var(--o);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .16s steps(4) both}
@keyframes up{from{transform:translateY(32px)}}
.pn .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pn h2{font-family:var(--f-head);font-size:12px;line-height:1.5;text-transform:uppercase;color:var(--accent)}
.pn .sub{color:var(--mute);font-size:17px;margin:-6px 0 14px}
.pn .q{width:100%;height:46px;border:0;box-shadow:0 0 0 3px var(--o);background:var(--bg);padding-inline:12px;margin-bottom:12px;border-radius:0}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 4px;border-top:3px solid var(--o)}
.opt i{width:10px;height:10px;background:var(--mc);flex:none}
.opt span{flex:1;min-width:0;overflow-wrap:anywhere}
.opt small{color:var(--mute);font-size:16px}
.mk{display:flex;gap:8px;align-items:center;padding:12px 0;border-top:3px solid var(--o)}
.mk select{flex:1;min-width:0;height:42px;border:0;box-shadow:0 0 0 3px var(--o);background:var(--bg);padding-inline:8px;border-radius:0}
.pn h3{font-family:var(--f-head);font-size:8px;line-height:1.5;text-transform:uppercase;color:var(--mute);margin:20px 0 6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:#14101c;padding:10px 16px;font-size:18px;font-weight:600;z-index:60;box-shadow:var(--ob),0 6px 0 0 var(--o);max-width:calc(100% - 40px);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* челлендж */
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.brand img{width:52px;height:52px;flex:none;box-shadow:var(--ob)}
.brand h1{font-family:var(--f-head);font-size:16px;line-height:1.5;text-transform:uppercase;color:var(--accent);text-shadow:3px 3px 0 var(--o)}
.brand .mute{font-size:17px;margin-top:4px}
.hero{background:var(--surface);box-shadow:var(--ob),var(--bev);padding:16px;margin-bottom:22px}
.hero .big{font-family:var(--f-head);font-size:24px;line-height:1.3;text-transform:uppercase;margin:8px 0 14px;color:var(--ink);text-shadow:3px 3px 0 var(--o)}
.hero .big small{font-size:19px;color:var(--mute);text-shadow:none}
.pbar{display:flex;gap:2px;height:16px;padding:3px;background:var(--bg);box-shadow:0 0 0 3px var(--o)}
.pbar i{flex:1;background:#3a3652}
.pbar i.on{background:var(--accent)}
.pbar i.now{background:var(--pr)}
.hero .btn{width:100%}
.talk{display:flex;gap:16px;align-items:flex-end;margin-top:18px}
.talk img{flex:none;display:block}
.talk .bw{flex:1;min-width:0;padding-bottom:6px}
.bubble{position:relative;background:var(--bub);color:#14101c;padding:12px 14px;font-size:20px;font-weight:600;line-height:1.25;box-shadow:var(--ob);margin-left:6px}

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- справочники ---------- */
const GROUPS=['Грудь','Спина','Ноги','Плечи','Бицепс','Трицепс','Ягодицы','Пресс'];
const GIDX=Object.fromEntries(GROUPS.map((g,i)=>[g,i+1]));
const gc=g=>GIDX[g]?`var(--m${GIDX[g]})`:'var(--mute)';
const CATALOG={
 'Грудь':['Жим штанги лёжа','Жим гантелей лёжа','Жим штанги на наклонной скамье','Жим гантелей на наклонной скамье','Разводка гантелей','Сведение рук в кроссовере','Отжимания на брусьях','Отжимания от пола','Жим в тренажёре','Бабочка'],
 'Спина':['Становая тяга','Подтягивания','Тяга штанги в наклоне','Тяга верхнего блока','Тяга нижнего блока','Тяга гантели одной рукой','Т-тяга','Гиперэкстензия'],
 'Ноги':['Приседания со штангой','Фронтальные приседания','Жим ногами','Румынская тяга','Выпады','Болгарские сплит-приседания','Разгибание ног','Сгибание ног','Подъём на носки стоя'],
 'Плечи':['Жим штанги стоя','Жим гантелей сидя','Махи гантелей в стороны','Махи гантелей в наклоне','Тяга штанги к подбородку','Жим Арнольда','Обратная бабочка'],
 'Бицепс':['Подъём штанги на бицепс','Подъём гантелей на бицепс','Молотки','Сгибания на скамье Скотта','Сгибания на блоке'],
 'Трицепс':['Французский жим','Разгибания на блоке','Жим штанги узким хватом','Отжимания узким хватом','Разгибания из-за головы','Обратные отжимания'],
 'Ягодицы':['Ягодичный мостик','Отведение ноги в кроссовере','Махи ногой назад','Приседания сумо'],
 'Пресс':['Скручивания','Подъём ног в висе','Планка','Скручивания на блоке','Ролик для пресса']
};
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const IC={
 back:"<svg class=\"pxi\" viewBox=\"0 0 5 7\" shape-rendering=\"crispEdges\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"3\" y=\"0\" width=\"2\" height=\"1\"/><rect x=\"2\" y=\"1\" width=\"2\" height=\"1\"/><rect x=\"1\" y=\"2\" width=\"2\" height=\"1\"/><rect x=\"0\" y=\"3\" width=\"2\" height=\"1\"/><rect x=\"1\" y=\"4\" width=\"2\" height=\"1\"/><rect x=\"2\" y=\"5\" width=\"2\" height=\"1\"/><rect x=\"3\" y=\"6\" width=\"2\" height=\"1\"/></svg>",
 next:"<svg class=\"pxi\" viewBox=\"0 0 5 7\" shape-rendering=\"crispEdges\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"0\" y=\"0\" width=\"2\" height=\"1\"/><rect x=\"1\" y=\"1\" width=\"2\" height=\"1\"/><rect x=\"2\" y=\"2\" width=\"2\" height=\"1\"/><rect x=\"3\" y=\"3\" width=\"2\" height=\"1\"/><rect x=\"2\" y=\"4\" width=\"2\" height=\"1\"/><rect x=\"1\" y=\"5\" width=\"2\" height=\"1\"/><rect x=\"0\" y=\"6\" width=\"2\" height=\"1\"/></svg>",
 chk:"<svg class=\"pxi\" viewBox=\"0 0 8 5\" shape-rendering=\"crispEdges\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"6\" y=\"0\" width=\"2\" height=\"1\"/><rect x=\"5\" y=\"1\" width=\"2\" height=\"1\"/><rect x=\"0\" y=\"2\" width=\"2\" height=\"1\"/><rect x=\"4\" y=\"2\" width=\"2\" height=\"1\"/><rect x=\"1\" y=\"3\" width=\"4\" height=\"1\"/><rect x=\"2\" y=\"4\" width=\"2\" height=\"1\"/></svg>"
};

/* ---------- даты и числа ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayISO=()=>iso(new Date());
const fmtDay=s=>{const d=parse(s);return `${d.getDate()} ${MONTHS_G[d.getMonth()]}`};
const fmtShort=s=>{const d=parse(s);return `${d.getDate()} ${MONTHS_G[d.getMonth()].slice(0,3)}`};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmt=n=>{n=Math.round(n*10)/10;return String(n).replace('.',',')};
const fmtVol=v=>v>=1000?`${fmt(v/1000)} т`:`${fmt(v)} кг`;
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- расчёты ---------- */
const doneSets=ex=>ex.sets.filter(s=>s.done&&+s.r>0);
const setVol=s=>(+s.w||0)*(+s.r||0);
const e1=s=>{const w=+s.w||0,r=+s.r||0;return r<=1?w:w*(1+r/30)};
const score=s=>(+s.w>0?e1(s):+s.r);
const setTxt=s=>+s.w>0?`${fmt(+s.w)}×${s.r}`:`${s.r} повт.`;
function wStats(w){let sets=0,vol=0,total=0;for(const ex of w.exercises){total+=ex.sets.length;for(const s of doneSets(ex)){sets++;vol+=setVol(s)}}return{sets,vol,total}}
function groupsOf(w){const o=[];for(const ex of w.exercises)if(!o.includes(ex.g))o.push(ex.g);return o}
const wName=w=>w.title||groupsOf(w).join(' + ')||'Тренировка';

/* ---------- состояние и хранение ---------- */
const LS='k30.v1',LSR='k30.rest',LSC='k30.start',LSX='k30.export',LSD='k30.hide';
const TAG=''; /* ник Instagram для картинки итогов, например '@kachalka30' */
const STANDALONE=!(window.claude&&window.claude.use);
let workouts={};
const now=new Date();
const S={tab:'ch',start:'',cdSel:'',editStart:false,from:'cal',y:now.getFullYear(),m:now.getMonth(),sel:todayISO(),active:null,range:12,metric:'weight',pEx:null,
  sync:'',noDemo:true,confirmDel:false,confirmEx:null,sheet:null,restSec:90,_demo:null};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
{const r=+lsGet(LSR);if([60,90,120,180].includes(r))S.restSec=r;const s=lsGet(LSC);if(/^\d{4}-\d{2}-\d{2}$/.test(s||''))S.start=s}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){return{}}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(workouts))}catch(e){}}
const sig=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
const clone=o=>JSON.parse(JSON.stringify(o));

let col=null;const timers={},chains={},busy={};
const dirty=id=>!!(timers[id]||busy[id]);
function persist(id){
  saveLocal();
  if(!col)return;
  clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),500);
  setSync('saving');
}
function flush(id){
  delete timers[id];busy[id]=(busy[id]||0)+1;
  chains[id]=(chains[id]||Promise.resolve()).then(async()=>{
    try{const w=workouts[id];if(w)await col.doc(id).set(w);else await col.doc(id).delete();setSync('cloud')}
    catch(e){setSync('err')}
    finally{busy[id]--;if(!busy[id])delete busy[id]}
  });
}
function setSync(v){S.sync=v;paintSync()}
function paintSync(){
  const el=$('#sync');if(!el)return;
  el.textContent={'':'',local:'Данные хранятся только на этом устройстве',cloud:'Сохранено в облаке, видно с любого устройства',saving:'Сохраняю…',err:'Не удалось сохранить в облако, копия есть на устройстве'}[S.sync]||'';
}
async function initCloud(){
  if(!(window.claude&&window.claude.use)){setSync('local');return}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id){setSync('local');return}
    col=db.collection('data/users/'+id);
    let first=true;
    col.onSnapshot(snap=>{
      if(first){
        first=false;
        if(snap.empty&&Object.keys(workouts).length){Object.keys(workouts).forEach(persist);setSync('saving');return}
      }
      const remote={};snap.docs.forEach(d=>{remote[d.id]=d.data()});
      let changed=false;
      for(const id in remote){if(!dirty(id)&&sig(remote[id])!==sig(workouts[id])){workouts[id]=clone(remote[id]);changed=true}}
      for(const id in workouts){if(!remote[id]&&!dirty(id)){delete workouts[id];changed=true}}
      if(changed){saveLocal();softRender()}
      if(!Object.keys(timers).length&&S.sync!=='saving')setSync('cloud');
    },()=>setSync('local'));
  }catch(e){setSync('local')}
}
async function exportData(){
  const data={app:'k30',v:2,exported:new Date().toISOString(),challenge:{start:S.start||''},workouts};
  const name=`30dney-kachalka-${todayISO()}.json`;
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  try{
    const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Копия Тоннаж'});lsSet(LSX,Date.now());toast('Копия сохранена');render();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  lsSet(LSX,Date.now());toast('Копия скачана');render();
}
function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result),src=d&&d.workouts?d.workouts:d;let n=0;
      for(const id of Object.keys(src)){
        const w=src[id];
        if(!w||typeof w!=='object'||!/^\d{4}-\d{2}-\d{2}$/.test(w.date||'')||!Array.isArray(w.exercises)||!/^[A-Za-z0-9_-]+$/.test(id))continue;
        w.id=id;workouts[id]=w;persist(id);n++;
      }
      const cs=d&&d.challenge&&d.challenge.start;
      if(!S.start&&/^\d{4}-\d{2}-\d{2}$/.test(cs||'')){S.start=cs;lsSet(LSC,cs)}
      render();toast(n?`Загружено тренировок: ${n}`:'В файле нет тренировок');
    }catch(e){toast('Не удалось прочитать файл')}
  };
  fr.readAsText(file);
}
function softRender(){
  const a=document.activeElement;
  if(a&&a.matches&&a.matches('#view input')){S.late=true;return}
  render();
}

/* ---------- данные для показа (пример, пока нет своих) ---------- */
function demoData(){
  if(S._demo)return S._demo;
  const T={
   A:['Грудь + трицепс',[['Жим штанги лёжа','Грудь',70,2.5,[8,8,7,6]],['Жим гантелей на наклонной скамье','Грудь',24,1,[10,9,8]],['Махи гантелей в стороны','Плечи',8,.5,[14,12,12]],['Французский жим','Трицепс',30,1,[12,10,10]],['Разгибания на блоке','Трицепс',32,1.5,[15,12,12]]]],
   B:['Спина + бицепс',[['Тяга штанги в наклоне','Спина',60,2,[8,8,8,6]],['Подтягивания','Спина',0,0,[6,5,5,4]],['Тяга верхнего блока','Спина',50,2,[12,10,10]],['Подъём штанги на бицепс','Бицепс',27.5,1,[10,9,8]],['Молотки','Бицепс',12,.5,[12,10,10]]]],
   C:['Ноги + пресс',[['Приседания со штангой','Ноги',80,2.5,[8,8,6,6]],['Румынская тяга','Ноги',70,2.5,[10,10,8]],['Жим ногами','Ноги',140,5,[12,12,10]],['Ягодичный мостик','Ягодицы',80,5,[12,12,10]],['Подъём ног в висе','Пресс',0,0,[12,12,10]]]]
  };
  const out={},td=todayISO(),m0=monday(new Date());let n=0;
  for(let k=7;k>=0;k--){
    const wk=7-k;
    [['A',0],['B',2],['C',4]].forEach(([key,off])=>{
      const d=new Date(m0);d.setDate(d.getDate()-k*7+off);const ds=iso(d);if(ds>td)return;
      const [title,exs]=T[key];
      const id='demo'+(n++);
      out[id]={id,date:ds,title,demo:true,created:n,exercises:exs.map(([name,g,base,inc,pat])=>({
        id:uid(),name,g,sets:pat.map((r,i)=>({w:Math.round((base+inc*wk)*2)/2,r:r+(base===0?Math.floor(wk/3):((wk+i)%4===0?1:0)),done:true}))
      }))};
    });
  }
  return S._demo=out;
}
const isDemo=()=>!Object.keys(workouts).length&&!S.noDemo;
const all=()=>isDemo()?demoData():workouts;
const list=()=>Object.values(all()).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0));
const curW=()=>all()[S.active]||null;

function history(name){
  const out=[];
  for(const w of list())for(const ex of w.exercises){
    if(ex.name!==name)continue;const ds=doneSets(ex);if(ds.length)out.push({date:w.date,wid:w.id,sets:ds});
  }
  return out;
}
function lastTime(name,date,wid){
  const ls=list().filter(w=>w.id!==wid&&w.date<=date).reverse();
  for(const w of ls)for(const ex of w.exercises)if(ex.name===name){const ds=doneSets(ex);if(ds.length)return{date:w.date,sets:ds}}
  return null;
}
function priorBest(name,w){
  let b=0;
  for(const h of history(name)){if(h.wid===w.id)continue;if(h.date>w.date)continue;for(const s of h.sets)b=Math.max(b,score(s))}
  return b;
}
function knownExercises(){
  const m=new Map();
  for(const g of GROUPS)for(const n of CATALOG[g])m.set(n,{name:n,g,c:0});
  for(const w of list())for(const ex of w.exercises){const o=m.get(ex.name)||{name:ex.name,g:ex.g,c:0};o.c++;m.set(ex.name,o)}
  return[...m.values()];
}

const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:(k>1&&k<5)?b:c};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const dayWorkout=date=>list().find(w=>w.date===date&&w.exercises.length);
const hasDone=date=>list().some(w=>w.date===date&&wStats(w).sets>0);
const repTxt=r=>r.every(x=>x===r[0])?`${r.length}×${r[0]}`:`${r.length} подх.`;
function nextMonday(){const d=new Date(),k=(8-d.getDay())%7;d.setDate(d.getDate()+k);return iso(d)}
function chDays(){const a=[];for(let i=0;i<30;i++){const date=addDays(S.start,i),dow=parse(date).getDay();a.push({n:i+1,date,dow,p:PROGRAM[dow]||null})}return a}
function progTpl(dow,date){
  const p=PROGRAM[dow];if(!p)return null;
  return{title:p.title,exercises:p.ex.map(([name,g,reps])=>{
    const prev=lastTime(name,date,null);
    return{name,g,sets:reps.map((r,i)=>{const ps=prev&&(prev.sets[i]||prev.sets[prev.sets.length-1]);return{w:ps?ps.w:'',r}})};
  })};
}
function openProgWorkout(date){

  if(ex){S.active=ex.id;if(S.tab!=='log')S.from=S.tab;S.tab='log';S.confirmDel=false;render();window.scrollTo(0,0);return}
  const tpl=progTpl(parse(date).getDay(),date);
  if(!tpl){openSheet({type:'new',date});return}
  createWorkout(date,tpl);
}

function viewCh(){
  const td=todayISO();
  let h=`<div class="brand"><img src="icons/icon-192.png" width="52" height="52" alt=""><div><h1>Тоннаж</h1><div class="mute">Пн · Ср · Пт · 30 дней вместе</div></div></div><div class="sync" id="sync"></div>${nudges()}`;
  if(!S.start||S.editStart)return h+setupCard()+chFooter();
  const days=chDays(),end=days[29].date,n=dayDiff(td,S.start)+1,state=n<1?'before':n>30?'after':'on';
  if(!S.cdSel||S.cdSel<S.start||S.cdSel>end)S.cdSel=state==='on'?td:days[0].date;
  const inR=list().filter(w=>w.date>=S.start&&w.date<=end);
  let sets=0,vol=0,tr=0;inR.forEach(w=>{const s=wStats(w);if(s.sets){tr++;sets+=s.sets;vol+=s.vol}});
  const planned=days.filter(d=>d.p).length,okc=days.filter(d=>d.p&&hasDone(d.date)).length;
  let hero='';
  if(state==='before'){
    const k=dayDiff(S.start,td),f=days.find(d=>d.p);
    hero=`<div class="label">Челлендж</div><div class="big">Старт через ${k} ${plural(k,'день','дня','дней')}</div>${pbar(0)}<div class="plan">${WD[parse(S.start).getDay()]}, ${fmtDay(S.start)}. Первая тренировка: <b>${f.p.title}</b>, ${fmtDay(f.date)}.</div>${talk('idle',say('before',k))}`;
  }else if(state==='on'){
    const dd=days[n-1],wk=dayWorkout(td),done=wk&&wStats(wk).sets>0;
    hero=`<div class="label">Челлендж</div><div class="big">День ${n}<small> / 30</small></div>${pbar(n)}`;
    if(dd.p){
      if(done){const s=wStats(wk);hero+=`<div class="plan">Сегодня выполнено: <b>${dd.p.title}</b>. ${s.sets} подх., ${fmtVol(s.vol)}.</div>${talk('flex',say('done',n),`<button class="btn" data-act="ch-open" data-date="${td}">Открыть тренировку</button>`)}`}
      else hero+=`<div class="plan">Сегодня: <b>${dd.p.title}</b></div>${talk('point',say(wk?'doing':'todo',n),`<button class="btn pri" data-act="ch-start" data-date="${td}">${wk?'Продолжить тренировку':'Начать тренировку'}</button>`)}`;
    }else{
      const nx=days.find(d=>d.n>n&&d.p);
      hero+=(nx?`<div class="plan">Сегодня отдых. Следующая тренировка: <b>${DOW[(nx.dow+6)%7]}, ${fmtDay(nx.date)}</b>, ${nx.p.title}.</div>`:`<div class="plan">Это последний день челленджа. Подведи итоги ниже.</div>`)+talk('idle',say(nx?'rest':'after',n));
    }
  }else{
    hero=`<div class="label">Челлендж</div><div class="big">30 дней<small> позади</small></div>${pbar(31)}<div class="plan">Выполнено тренировок по программе: <b>${okc} из ${planned}</b>.</div>${talk('flex',say('after'))}`;
  }
  const off=(parse(S.start).getDay()+6)%7;
  let cells='';for(let i=0;i<off;i++)cells+='<span class="cd blank"></span>';
  for(const d of days){
    const ok=hasDone(d.date),past=d.date<td;
    cells+=`<button class="${['cd',d.p?'pl':'rest',ok?'ok':'',d.p&&!ok&&past?'miss':'',d.date===td?'today':'',d.date===S.cdSel?'sel':''].join(' ')}"${d.p?` style="--mc:var(--m${d.p.color})"`:''} data-act="ch-day" data-date="${d.date}" aria-label="День ${d.n}, ${fmtDay(d.date)}, ${d.p?d.p.title:'отдых'}${ok?', выполнено':''}"><span class="cn">${d.n}</span><span class="cs">${d.p?(ok?IC.chk:'')+SHORT[d.dow]:'·'}</span></button>`;
  }
  const sd=days.find(d=>d.date===S.cdSel),swk=dayWorkout(sd.date);
  let det;
  if(sd.p){
    const gs=[...new Set(sd.p.ex.map(e=>e[1]))];
    det=`<div class="head"><h2>День ${sd.n} · ${DOW[(sd.dow+6)%7]}, ${fmtDay(sd.date)}</h2></div><div class="wcard" style="cursor:default"><div class="dayhead"><div><div class="t">${sd.p.title}</div><div class="chips">${gs.map(g=>`<span class="chip"><i style="--mc:${gc(g)}"></i>${g}</span>`).join('')}</div></div>${scene(SCENE_BY[sd.dow])}</div><ul class="exl">${sd.p.ex.map(([nm,g,r])=>`<li><span>${esc(nm)}</span><span>${repTxt(r)}</span></li>`).join('')}</ul></div>`;
    if(swk)det+=`<button class="btn" style="width:100%" data-act="ch-open" data-date="${sd.date}">Открыть тренировку</button>`;
    else if(sd.date<=td)det+=`<button class="btn pri" style="width:100%" data-act="ch-start" data-date="${sd.date}">${sd.date<td?'Записать пропущенную':'Начать тренировку'}</button>`;
    else det+=`<p class="note">Этот день ещё впереди.</p>`;
  }else{
    det=`<div class="head"><h2>День ${sd.n} · ${DOW[(sd.dow+6)%7]}, ${fmtDay(sd.date)}</h2></div><div class="empty">${scene('tired','sc')}День отдыха. Восстановление тоже часть программы.</div>${swk?`<button class="btn" style="width:100%;margin-top:12px" data-act="ch-open" data-date="${sd.date}">Открыть тренировку</button>`:sd.date<=td?`<button class="btn" style="width:100%;margin-top:12px" data-act="ch-free" data-date="${sd.date}">Записать свою тренировку</button>`:''}`;
  }
  h+=`<section class="hero">${hero}</section>
  <div class="strip"><div><div class="label">По плану</div><div class="v">${okc}<small> / ${planned}</small></div></div><div><div class="label">Подходов</div><div class="v">${sets}</div></div><div><div class="label">Тоннаж</div><div class="v">${vol>=1000?fmt(vol/1000)+' <small>т</small>':fmt(vol)+' <small>кг</small>'}</div></div></div>
  <div class="cal"><div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div><div class="cgrid">${cells}</div></div>
  <div class="legend"><span><i style="--mc:var(--m3)"></i>Пн ноги + плечи</span><span><i style="--mc:var(--m1)"></i>Ср грудь + бицепс + пресс</span><span><i style="--mc:var(--m2)"></i>Пт спина + трицепс</span></div>
  <section class="daypanel">${det}</section>
  ${sets?`<section class="daypanel"><button class="btn ${state==='after'?'pri':''}" style="width:100%" data-act="recap">Мои итоги: картинка для сторис</button></section>`:''}`;
  return h+chFooter();
}

/* итоги: картинка для сторис */
function recapData(){
  const st=S.start,en=addDays(st,29),td=todayISO();
  const ws=list().filter(w=>w.date>=st&&w.date<=en);
  let tr=0,sets=0,vol=0;ws.forEach(w=>{const s=wStats(w);if(s.sets){tr++;sets+=s.sets;vol+=s.vol}});
  const names=[...new Set(ws.flatMap(w=>w.exercises.filter(e=>doneSets(e).length).map(e=>e.name)))];
  const rows=[];
  for(const name of names){
    const hs=history(name).filter(h=>h.date>=st&&h.date<=en);if(!hs.length)continue;
    const bw=hs.every(h=>h.sets.every(s=>!(+s.w)));
    const a=sessionVals(hs[0],bw).weight,b=sessionVals(hs[hs.length-1],bw).weight;
    rows.push({name,n:hs.length,bw,a,b,d:b-a,pc:a?(b-a)/a:0});
  }
  rows.sort((p,q)=>(q.n>1)-(p.n>1)||q.pc-p.pc||q.n-p.n);
  const dn=Math.min(30,Math.max(1,dayDiff(td,st)+1));
  return{tr,sets,vol,rows:rows.slice(0,6),sub:dayDiff(td,st)>=29?'ИТОГИ · 30 ДНЕЙ ПРОЙДЕНО':`ИТОГИ · ДЕНЬ ${dn} ИЗ 30`};
}

let rest=null,restTimer=null;
function startRest(){
  rest={end:Date.now()+S.restSec*1000,total:S.restSec*1000,beeped:false};
  $('#rest').innerHTML=`<div class="restbar" id="rb"><div class="row"><div class="t" id="rt">0:00</div><div class="cap" id="rc">Отдых между подходами</div><button data-act="rest-add" data-v="-15">−15</button><button data-act="rest-add" data-v="15">+15</button><button data-act="rest-skip">Хватит</button></div><div class="bar"><i id="rbar"></i></div></div>`;
  clearInterval(restTimer);restTimer=setInterval(tickRest,250);tickRest();
}
function tickRest(){
  if(!rest)return;
  const left=rest.end-Date.now(),rb=$('#rb');if(!rb)return;
  if(left>0){
    const s=Math.ceil(left/1000);$('#rt').textContent=`${Math.floor(s/60)}:${pad(s%60)}`;
    $('#rbar').style.width=Math.max(0,Math.min(100,left/rest.total*100))+'%';
    $('#rc').textContent='Отдых между подходами';rb.classList.remove('over');rest.beeped=false;
  }else{
    $('#rt').textContent='0:00';$('#rbar').style.width='0%';$('#rc').textContent='Пора на следующий подход';rb.classList.add('over');
    if(!rest.beeped){rest.beeped=true;beep();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
    if(left<-30000)stopRest();
  }
}
function stopRest(){rest=null;clearInterval(restTimer);$('#rest').innerHTML=''}
function beep(){
  try{const c=new(window.AudioContext||window.webkitAudioContext)(),t0=c.currentTime;
    [[659.25,0],[880,.11],[1318.5,.22]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.045,t0+d);g.gain.setValueAtTime(0,t0+d+.09);o.connect(g);g.connect(c.destination);o.start(t0+d);o.stop(t0+d+.1)});
    setTimeout(()=>c.close(),700)}catch(e){}
}

/* ---------- прогресс ---------- */
function rangeStart(){
  if(!S.range)return'0000-00-00';
  const m=monday(new Date());m.setDate(m.getDate()-(S.range-1)*7);return iso(m);
}
function sessionVals(h,bw){
  const top=h.sets.reduce((a,s)=>(+s.w>+a.w||(+s.w===+a.w&&+s.r>+a.r))?s:a);
  return{
    weight:bw?Math.max(...h.sets.map(s=>+s.r)):+top.w,
    rm:Math.max(...h.sets.map(e1)),
    volume:bw?h.sets.reduce((t,s)=>t+(+s.r),0):h.sets.reduce((t,s)=>t+setVol(s),0),
    top
  };
}
function viewProg(){
  const start=rangeStart(),ls=list().filter(w=>w.date>=start);
  let sets=0,vol=0;ls.forEach(w=>{const s=wStats(w);sets+=s.sets;vol+=s.vol});
  const cnt={};
  for(const w of ls)for(const ex of w.exercises)if(doneSets(ex).length){const o=cnt[ex.name]||(cnt[ex.name]={name:ex.name,g:ex.g,c:0});o.c++}
  const opts=Object.values(cnt).sort((a,b)=>b.c-a.c||a.name.localeCompare(b.name,'ru'));
  if(!opts.find(o=>o.name===S.pEx))S.pEx=(opts[0]||{}).name||null;
  const hist=S.pEx?history(S.pEx).filter(h=>h.date>=start):[];
  const bw=hist.length&&hist.every(h=>h.sets.every(s=>!(+s.w)));
  if(bw&&S.metric==='rm')S.metric='weight';
  const mets=bw?[['weight','Лучший подход'],['volume','Всего повторений']]:[['weight','Рабочий вес'],['rm','Расчётный 1ПМ'],['volume','Объём']];
  const rec=records();
  return `<div class="top"><h1>Прогресс</h1><div class="seg" role="group" aria-label="Период">${[[4,'4 нед.'],[12,'12 нед.'],[0,'Всё']].map(([v,l])=>`<button data-act="range" data-v="${v}" aria-pressed="${S.range===v}">${l}</button>`).join('')}</div></div>
  <div class="sync" id="sync"></div>${demoBanner()}
  <div class="strip"><div><div class="label">Тренировок</div><div class="v">${ls.length}</div></div><div><div class="label">Подходов</div><div class="v">${sets}</div></div><div><div class="label">Тоннаж</div><div class="v">${vol>=1000?fmt(vol/1000)+' <small>т</small>':fmt(vol)+' <small>кг</small>'}</div></div></div>
  <section class="card"><h2>Динамика упражнения</h2>
   ${opts.length?`<div class="ctl"><select class="dd" id="pex" aria-label="Упражнение">${opts.map(o=>`<option value="${esc(o.name)}"${o.name===S.pEx?' selected':''}>${esc(o.name)}</option>`).join('')}</select><div class="seg" role="group" aria-label="Показатель">${mets.map(([k,l])=>`<button data-act="metric" data-v="${k}" aria-pressed="${S.metric===k}">${l}</button>`).join('')}</div></div>
   <div class="delta" id="delta"></div><div class="chart" id="ch1"></div><div class="note" id="n1"></div>`:`<div class="empty">За этот период нет выполненных подходов. Отмечай галочкой подходы в тренировке, и здесь появится график.</div>`}
  </section>
  <section class="card"><h2>Подходы по группам мышц</h2><div class="chart" id="ch2"></div><div class="legend" id="lg2"></div><div class="note">Считаются выполненные подходы за неделю. Неделя начинается с понедельника.</div></section>
  <section class="card"><h2>Личные рекорды</h2>${rec.length?rec.map(r=>`<div class="rec"><span class="nm">${esc(r.name)}</span><span class="v">${setTxt(r.s)}</span><span class="s">${fmtShort(r.date)}</span><span class="s">${+r.s.w>0&&+r.s.r>1?'1ПМ ~ '+fmt(e1(r.s))+' кг':''}</span></div>`).join(''):'<div class="empty">Рекорды появятся после первых выполненных подходов.</div>'}</section>`;
}
function records(){
  const best={};
  for(const w of list())for(const ex of w.exercises)for(const s of doneSets(ex)){
    const b=best[ex.name];if(!b||score(s)>score(b.s))best[ex.name]={name:ex.name,s,date:w.date};
  }
  return Object.values(best).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,8);
}
function niceTicks(lo,hi,n=4){
  if(lo===hi){hi=lo+1;lo=Math.max(0,lo-1)}
  const raw=(hi-lo)/n,mag=10**Math.floor(Math.log10(raw)),f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  const a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,t=[];
  for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));
  return t;
}
function drawCharts(){
  const start=rangeStart();
  /* линия по упражнению */
  const h1=$('#ch1');
  if(h1){
    const hist=history(S.pEx).filter(h=>h.date>=start);
    const bw=hist.every(h=>h.sets.every(s=>!(+s.w)));
    const key=S.metric==='rm'&&bw?'weight':S.metric;
    const unit=bw?'повт.':'кг';
    const pts=hist.map(h=>{const v=sessionVals(h,bw);return{t:parse(h.date).getTime(),date:h.date,v:v[key],top:v.top}});
    const g=(knownExercises().find(o=>o.name===S.pEx)||{}).g;
    const first=pts[0],last=pts[pts.length-1];
    if(pts.length>1){
      const d=last.v-first.v,pc=first.v?Math.round(d/first.v*100):0;
      $('#delta').innerHTML=`<b>${d>=0?'+':'−'}${fmt(Math.abs(d))} ${unit}</b> &nbsp;(${fmt(first.v)} » ${fmt(last.v)}, ${pc>=0?'+':'−'}${Math.abs(pc)}%) за ${fmtShort(first.date)} – ${fmtShort(last.date)}`;
      $('#n1').textContent='';
    }else{
      $('#delta').innerHTML=pts.length?`<b>${fmt(last.v)} ${unit}</b>`:'';
      $('#n1').textContent='Одна тренировка. Запиши ещё, чтобы увидеть динамику.';
    }
    lineChart(h1,pts,{color:gc(g),label:`${S.pEx}: ${S.metric}`,tip:p=>{
      const base=`${fmtDay(p.date)}<br><b>${fmt(p.v)} ${unit}</b>`;
      return key==='weight'&&!bw?`${base} · ${setTxt(p.top)}`:base;
    }});
  }
  /* стек по неделям */
  const n=S.range?S.range:Math.min(26,Math.max(4,Math.round((monday(new Date())-monday(parse((list()[0]||{date:todayISO()}).date)))/6048e5)+1));
  const m0=monday(new Date()),weeks=[];
  for(let i=n-1;i>=0;i--){const d=new Date(m0);d.setDate(d.getDate()-i*7);weeks.push({start:iso(d),end:iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+6)),c:{},total:0})}
  for(const w of list())for(const wk of weeks)if(w.date>=wk.start&&w.date<=wk.end)for(const ex of w.exercises){const k=doneSets(ex).length;if(k){wk.c[ex.g]=(wk.c[ex.g]||0)+k;wk.total+=k}}
  const present=GROUPS.filter(g=>weeks.some(wk=>wk.c[g]));
  $('#lg2').innerHTML=present.map(g=>`<span><i style="--mc:${gc(g)}"></i>${g}</span>`).join('');
  stackChart($('#ch2'),weeks,present);
}
function lineChart(host,pts,o){
  const W=Math.max(280,Math.floor(host.clientWidth||340)),H=220,L=42,R=18,T=22,B=26;
  if(!pts.length){host.innerHTML='';return}
  const vs=pts.map(p=>p.v),tk=niceTicks(Math.min(...vs),Math.max(...vs),4),y0=tk[0],y1=tk[tk.length-1];
  const t0=pts[0].t,t1=pts[pts.length-1].t,iw=W-L-R,ih=H-T-B;
  const X=t=>t1===t0?L+iw/2:L+(t-t0)/(t1-t0)*iw,Y=v=>T+ih-(v-y0)/(y1-y0||1)*ih;
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`).join('');
  const area=pts.length>1?`${line}L${X(t1).toFixed(1)} ${T+ih}L${X(t0).toFixed(1)} ${T+ih}Z`:'';
  const nx=Math.min(pts.length,4),xl=[];
  if(pts.length===1)xl.push(pts[0]);else for(let i=0;i<nx;i++)xl.push(pts[Math.round(i*(pts.length-1)/(nx-1))]);
  const lp=pts[pts.length-1],lx=X(lp.t);
  host.style.setProperty('--sc',o.color);
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.label)}">
   ${tk.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`).join('')}
   <line class="axis" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>
   ${xl.map((p,i)=>`<text x="${X(p.t).toFixed(1)}" y="${H-7}" text-anchor="${xl.length===1?'middle':i===0?'start':i===xl.length-1?'end':'middle'}">${fmtShort(p.date)}</text>`).join('')}
   ${area?`<path class="ar" d="${area}"/>`:''}${pts.length>1?`<path class="ln" d="${line}"/>`:''}
   <line class="cross" id="cx" y1="${T}" y2="${T+ih}" x1="0" x2="0" style="display:none"/>
   ${pts.map((p,i)=>{const z=i===pts.length-1?10:8;return `<rect class="pt" data-i="${i}" x="${(X(p.t)-z/2).toFixed(1)}" y="${(Y(p.v)-z/2).toFixed(1)}" width="${z}" height="${z}"/>`}).join('')}
   <text class="vl" x="${lx.toFixed(1)}" y="${(Y(lp.v)-11).toFixed(1)}" text-anchor="${lx>W-46?'end':'middle'}">${fmt(lp.v)}</text>
  </svg><div class="tip" hidden></div>`;
  const svg=host.querySelector('svg'),tip=host.querySelector('.tip'),cx=host.querySelector('#cx');
  const move=e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;
    let bi=0,bd=1e9;pts.forEach((p,i)=>{const d=Math.abs(X(p.t)-x);if(d<bd){bd=d;bi=i}});
    const p=pts[bi];cx.style.display='';cx.setAttribute('x1',X(p.t));cx.setAttribute('x2',X(p.t));
    tip.hidden=false;tip.innerHTML=o.tip(p);
    tip.style.left=Math.max(60,Math.min(W-60,X(p.t)))+'px';tip.style.top=(Y(p.v)-10)+'px';
  };
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{tip.hidden=true;cx.style.display='none'});
}
function stackChart(host,weeks,present){
  const W=Math.max(280,Math.floor(host.clientWidth||340)),H=210,L=34,R=8,T=14,B=26;
  const max=Math.max(0,...weeks.map(w=>w.total));
  if(!max){host.innerHTML='<div class="empty">Пока нет выполненных подходов.</div>';return}
  const tk=niceTicks(0,max,4),y1=tk[tk.length-1],iw=W-L-R,ih=H-T-B,band=iw/weeks.length,bw=Math.min(36,band*.66);
  const Y=v=>T+ih-v/y1*ih,k=Math.max(1,Math.ceil(52/band));
  let bars='',lab='';
  weeks.forEach((wk,i)=>{
    const cx=L+band*i+band/2;let acc=0;
    present.forEach(g=>{const v=wk.c[g];if(!v)return;const ytop=Y(acc+v),h=Y(acc)-ytop;
      bars+=`<rect class="seg-r" x="${(cx-bw/2).toFixed(1)}" y="${ytop.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" style="fill:${gc(g)}"/>`;acc+=v});
    if((weeks.length-1-i)%k===0)lab+=`<text x="${cx.toFixed(1)}" y="${H-7}" text-anchor="middle">${fmtShort(wk.start)}</text>`;
  });
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Подходы по группам мышц по неделям">
   ${tk.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`).join('')}
   <rect class="hl" id="hl" x="0" y="${T}" width="${band.toFixed(1)}" height="${ih}" style="display:none"/>
   <line class="axis" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>${bars}${lab}</svg><div class="tip" hidden></div>`;
  const svg=host.querySelector('svg'),tip=host.querySelector('.tip'),hl=host.querySelector('#hl');
  const move=e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,i=Math.floor((x-L)/band);
    if(i<0||i>=weeks.length){tip.hidden=true;hl.style.display='none';return}
    const wk=weeks[i];hl.style.display='';hl.setAttribute('x',L+band*i);
    tip.hidden=false;
    tip.innerHTML=`${fmtDay(wk.start)} – ${fmtDay(wk.end)}<br>`+(wk.total?present.filter(g=>wk.c[g]).map(g=>`<i style="--mc:${gc(g)}"></i>${g}: <b>${wk.c[g]}</b>`).join('<br>')+`<br>Всего: <b>${wk.total}</b>`:'Тренировок не было');
    tip.style.left=Math.max(70,Math.min(W-70,L+band*i+band/2))+'px';tip.style.top=Math.max(40,Y(wk.total)-6)+'px';
  };
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{tip.hidden=true;hl.style.display='none'});
}

}
function parseNum(str,int){
  const t=String(str).replace(',','.').replace(/[^0-9.]/g,'');
  if(t===''||t==='.')return'';
  const n=parseFloat(t);return Number.isFinite(n)?(int?Math.round(n):n):'';
}

     w.exercises=w.exercises.filter(x=>x.id!==b.dataset.ex);S.confirmEx=null;persist(w.id);render();break}
   case'rest-dur':S.restSec=+b.dataset.v;lsSet(LSR,S.restSec);render();break;
   case'rest-add':if(rest){rest.end+=+b.dataset.v*1000;rest.total=Math.max(rest.total,rest.end-Date.now());tickRest()}break;
   case'rest-skip':stopRest();break;
   case'export':exportData();break;
   case'import':{const f=$('#impf');if(f)f.click();break}
   case'range':S.range=+b.dataset.v;render();break;
   case'metric':S.metric=b.dataset.v;render();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='exq'){S.sheet.q=t.value;paintExList();return}
  const w=curW();if(!w||w.demo)return;
  if(t.id==='wtitle'){w.title=t.value;persist(w.id);return}
  if(t.matches&&t.matches('input[data-f]')){
    const row=t.closest('.set'),ex=w.exercises.find(x=>x.id===row.dataset.ex),f=t.dataset.f;
    ex.sets[+row.dataset.i][f]=parseNum(t.value,f==='r');
    persist(w.id);refreshStats();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='impf'){if(t.files[0])importData(t.files[0]);t.value='';return}
  if(t.id==='newg'&&S.sheet){S.sheet.newg=t.value;return}
  if(t.id==='pex'){S.pEx=t.value;render();return}
  if(t.id==='wdate'){
    const w=curW();if(!w||w.demo||!/^\d{4}-\d{2}-\d{2}$/.test(t.value))return;
    w.date=t.value;S.sel=t.value;persist(w.id);render();
  }
});
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input[data-f]'))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});
document.addEventListener('focusout',e=>{if(S.late)setTimeout(()=>{const a=document.activeElement;if(S.late&&!(a&&a.matches&&a.matches('#view input')))render()},400)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet)closeSheet();
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('input[data-f],#wtitle'))e.target.blur();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.tab==='log')wake(true)});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.tab==='prog')drawCharts()},150)});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S.tab==='ch'&&!S.sheet)render()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;if(S.tab==='ch')render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
workouts=loadLocal();
render();
initCloud();
})();
</script>
